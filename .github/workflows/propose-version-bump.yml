name: Propose VERSION Bump

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      bump_level:
        description: 'Version bump type'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Compute next version
        id: version
        env:
          BUMP_LEVEL: ${{ github.event.inputs.bump_level }}
        run: |
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION format: $CURRENT_VERSION"
            exit 1
          fi

          LEVEL="${BUMP_LEVEL:-patch}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$LEVEL" in
            patch)
              PATCH=$((PATCH + 1))
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            *)
              echo "Unsupported bump level: $LEVEL"
              exit 1
              ;;
          esac

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          TITLE="chore: bump VERSION to v$NEXT_VERSION"
          BRANCH="chore/version-bump-v$NEXT_VERSION"
          BRANCH_EXISTS=false

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
          fi

          {
            echo "current=$CURRENT_VERSION"
            echo "next=$NEXT_VERSION"
            echo "title=$TITLE"
            echo "branch=$BRANCH"
            echo "branch_exists=$BRANCH_EXISTS"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing open bump PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TITLE="${{ steps.version.outputs.title }}"
          PR_NUMBER="$(
            gh pr list --state open --base main --json number,title |
              python3 -c 'import json, os, sys; title = os.environ["TITLE"]; print(next((str(item["number"]) for item in json.load(sys.stdin) if item.get("title") == title), ""), end="")'
          )"
          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create bump commit
        if: steps.existing-pr.outputs.exists != 'true' && steps.version.outputs.branch_exists != 'true'
        run: |
          git checkout -b "${{ steps.version.outputs.branch }}"
          echo "${{ steps.version.outputs.next }}" > VERSION
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VERSION
          git commit -s -m "${{ steps.version.outputs.title }}"
          git push -u origin "${{ steps.version.outputs.branch }}"

      - name: Create or update tracking issue
        if: steps.existing-pr.outputs.exists != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'VERSION bump proposal: v${{ steps.version.outputs.next }}';
            const branch = '${{ steps.version.outputs.branch }}';
            const current = '${{ steps.version.outputs.current }}';
            const next = '${{ steps.version.outputs.next }}';
            const branchExists = '${{ steps.version.outputs.branch_exists }}' === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Monthly VERSION bump proposal from v${current} to v${next}.`,
              '',
              `Branch: \`${branch}\``,
              `Branch already existed before this run: \`${branchExists}\``,
              `Workflow run: ${runUrl}`,
              '',
              'GitHub Actions cannot create pull requests in this repository with the default token, so this issue tracks the prepared bump branch.',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Existing PR already open
        if: steps.existing-pr.outputs.exists == 'true'
        run: |
          echo "Version bump PR already open: #${{ steps.existing-pr.outputs.number }}"
