name: Propose VERSION Bump

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      bump_level:
        description: 'Version bump type'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: version-proposal-main
  cancel-in-progress: false

jobs:
  propose-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Propose release version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_LEVEL: ${{ inputs.bump_level || 'patch' }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync('gh', ['auth', 'setup-git']);
            const { propose } = require('./.github/scripts/version-proposal.cjs');
            const result = await propose({ github, context, level: process.env.BUMP_LEVEL });
            core.info(JSON.stringify(result));
