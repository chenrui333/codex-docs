name: Update Codex Feature Flags

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-feature-flags.yml"
      - "scripts/snapshot_feature_flags.py"
      - "docs/learn.chatgpt.com/docs/config-file/config-basic/index.md"
      - "docs/learn.chatgpt.com/docs/config-file/config-reference/index.md"
      - "docs/feature-flags/**"

permissions:
  contents: read

jobs:
  validate-feature-flags:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Read snapshot inputs
        id: snapshot_cli
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          snapshot = json.loads(Path("docs/feature-flags/lifecycle.json").read_text())
          raw_version = snapshot["codex_cli_version"]
          match = re.search(r"\b(\d+\.\d+\.\d+(?:[-+][^\s]+)?)\b", raw_version)
          if not match:
              raise SystemExit(f"Could not parse Codex CLI package version from {raw_version!r}")

          print(f"npm_version={match.group(1)}")
          print(f"source_commit={snapshot['source_commit']}")
          PY

      - name: Install snapshot CLI version
        run: npm install -g "@openai/codex@${{ steps.snapshot_cli.outputs.npm_version }}"

      - name: Generate feature lifecycle snapshot
        env:
          CODEX_FEATURE_SOURCE_COMMIT: ${{ steps.snapshot_cli.outputs.source_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshot_feature_flags.py

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-flags-snapshot-ubuntu-latest
          path: docs/feature-flags/
          if-no-files-found: error

      - name: Check for snapshot changes
        id: changed
        run: |
          if git diff --quiet -- docs/feature-flags/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce snapshot freshness
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "Feature-flag snapshot drift detected. Run:"
          echo "  python3 scripts/snapshot_feature_flags.py"
          echo "and commit docs/feature-flags/*."
          git --no-pager diff -- docs/feature-flags/
          exit 1

  update-feature-flags:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-writer-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install latest CLI
        run: npm install -g @openai/codex

      - name: Generate feature lifecycle snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshot_feature_flags.py

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-flags-snapshot-ubuntu-latest
          path: docs/feature-flags/
          if-no-files-found: error

      - name: Check for snapshot changes
        id: changed
        run: |
          if git diff --quiet -- docs/feature-flags/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push snapshot updates
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/feature-flags/
          git commit -s -m "chore: refresh feature-flag lifecycle snapshot ($(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push
