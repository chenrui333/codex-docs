name: Update Codex Feature Flags

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-feature-flags.yml"
      - "scripts/snapshot_feature_flags.py"
      - "docs/developers.openai.com/codex/config-basic/index.md"
      - "docs/developers.openai.com/codex/config-reference/index.md"
      - "docs/feature-flags/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-feature-flags:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Read snapshot CLI version
        id: snapshot_cli
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          raw_version = json.loads(Path("docs/feature-flags/lifecycle.json").read_text())["codex_cli_version"]
          match = re.search(r"\b(\d+\.\d+\.\d+(?:[-+][^\s]+)?)\b", raw_version)
          if not match:
              raise SystemExit(f"Could not parse Codex CLI package version from {raw_version!r}")

          print(f"npm_version={match.group(1)}")
          PY

      - name: Install snapshot CLI version
        run: npm install -g "@openai/codex@${{ steps.snapshot_cli.outputs.npm_version }}"

      - name: Generate feature lifecycle snapshot
        run: python3 scripts/snapshot_feature_flags.py

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-flags-snapshot-ubuntu-latest
          path: docs/feature-flags/
          if-no-files-found: error

      - name: Check for snapshot changes
        id: changed
        run: |
          if git diff --quiet -- docs/feature-flags/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce snapshot freshness
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "Feature-flag snapshot drift detected. Run:"
          echo "  python3 scripts/snapshot_feature_flags.py"
          echo "and commit docs/feature-flags/*."
          git --no-pager diff -- docs/feature-flags/
          exit 1

  update-feature-flags:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Install latest CLI
        run: npm install -g @openai/codex

      - name: Generate feature lifecycle snapshot
        run: python3 scripts/snapshot_feature_flags.py

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-flags-snapshot-ubuntu-latest
          path: docs/feature-flags/
          if-no-files-found: error

      - name: Check for snapshot changes
        id: changed
        run: |
          if git diff --quiet -- docs/feature-flags/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push snapshot updates
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/feature-flags/
          git commit -s -m "chore: refresh feature-flag lifecycle snapshot ($(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push
