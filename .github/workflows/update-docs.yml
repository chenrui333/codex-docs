name: Update Codex Documentation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@latest
          codex --version

      - name: Sync docs
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/fetch_codex_docs.py 2>&1 | tee sync.log

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-log
          path: sync.log
          if-no-files-found: warn

      - name: Upload source coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-coverage
          path: docs/source_coverage.json
          if-no-files-found: warn

      - name: Check recorded sync failures
        if: steps.sync.outcome == 'success'
        id: recorded_failures
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path


          report_errors = []


          def load_json(path: Path) -> dict:
              if not path.exists():
                  report_errors.append(f'missing report: {path}')
                  return {}

              try:
                  payload = json.loads(path.read_text())
              except json.JSONDecodeError as error:
                  report_errors.append(f'invalid JSON in {path}: {error}')
                  return {}

              if not isinstance(payload, dict):
                  report_errors.append(f'unexpected report shape: {path}')
                  return {}

              return payload


          def failure_count(value: object) -> int:
              try:
                  return int(value or 0)
              except (TypeError, ValueError):
                  return 1 if value else 0


          summary = load_json(Path('docs/sync_summary.json'))
          coverage = load_json(Path('docs/source_coverage.json'))
          coverage_sync = coverage.get('sync', {})
          if not isinstance(coverage_sync, dict):
              coverage_sync = {}

          summary_failures = failure_count(summary.get('failure_count'))
          coverage_failures = failure_count(coverage_sync.get('failure_count'))
          has_failures = bool(report_errors or summary_failures or coverage_failures)

          print(f'summary_failure_count={summary_failures}')
          print(f'coverage_failure_count={coverage_failures}')
          print(f'has_failures={str(has_failures).lower()}')

          if has_failures:
              details = ', '.join(report_errors) if report_errors else 'recorded source failures'
              print(
                  '::error::Docs sync recorded failures: '
                  f'sync_summary failure_count={summary_failures}, '
                  f'source_coverage sync.failure_count={coverage_failures}; '
                  f'{details}.',
                  file=sys.stderr,
              )
          PY

      - name: Check for changes
        if: steps.sync.outcome == 'success' && steps.recorded_failures.outputs.has_failures != 'true'
        id: changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outcome == 'success' && steps.recorded_failures.outputs.has_failures != 'true' && steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ dot_codex/ system_prompts/ weekly/
          cli_version="$(codex --version | awk '{print $NF}')"
          git commit -s -m "chore: sync docs for cli ${cli_version} ($(date -u +'%Y-%m-%d'))"
          git fetch origin main
          git pull --rebase origin main
          git push

      - name: Create or update failure issue
        if: steps.sync.outcome == 'failure' || steps.recorded_failures.outputs.has_failures == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { readFileSync } = require('fs');

            const readText = (path) => {
              try {
                return readFileSync(path, 'utf8');
              } catch {
                return '';
              }
            };

            const tailLines = (text, lineCount) => text.split(/\r?\n/).slice(-lineCount).join('\n');

            const date = new Date().toISOString().split('T')[0];
            const title = `Codex docs sync failed - ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const syncLogTail = tailLines(readText('sync.log'), 120).slice(-12000) || '(no log available)';
            const syncSummary = readText('docs/sync_summary.json').slice(-12000) || '(no sync summary available)';
            const sourceCoverage = readText('docs/source_coverage.json').slice(-12000) || '(no source coverage available)';

            const body = [
              `Automated docs sync failed or recorded source failures on ${date}.`,
              '',
              `Workflow run: ${runUrl}`,
              '',
              '### Sync summary',
              '```json',
              syncSummary,
              '```',
              '',
              '### Source coverage',
              '```json',
              sourceCoverage,
              '```',
              '',
              '### Sync log tail',
              '```text',
              syncLogTail,
              '```',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug'],
              });
            }

      - name: Fail workflow when sync fails
        if: steps.sync.outcome == 'failure' || steps.recorded_failures.outputs.has_failures == 'true'
        run: exit 1
