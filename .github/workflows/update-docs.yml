name: Update Codex Documentation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@latest
          codex --version

      - name: Sync docs
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/fetch_codex_docs.py 2>&1 | tee sync.log

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-log
          path: sync.log
          if-no-files-found: warn

      - name: Upload source coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-coverage
          path: docs/source_coverage.json
          if-no-files-found: warn

      - name: Check for changes
        if: steps.sync.outcome == 'success'
        id: changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outcome == 'success' && steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ dot_codex/ system_prompts/ weekly/
          cli_version="$(codex --version | awk '{print $NF}')"
          git commit -m "chore: sync docs for cli ${cli_version} ($(date -u +'%Y-%m-%d'))"
          git push

      - name: Create or update failure issue
        if: steps.sync.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { readFileSync } = require('fs');

            const readText = (path) => {
              try {
                return readFileSync(path, 'utf8');
              } catch {
                return '';
              }
            };

            const tailLines = (text, lineCount) => text.split(/\r?\n/).slice(-lineCount).join('\n');

            const date = new Date().toISOString().split('T')[0];
            const title = `Codex docs sync failed - ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const syncLogTail = tailLines(readText('sync.log'), 120).slice(-12000) || '(no log available)';
            const syncSummary = readText('docs/sync_summary.json').slice(-12000) || '(no sync summary available)';

            const body = [
              `Automated docs sync failed on ${date}.`,
              '',
              `Workflow run: ${runUrl}`,
              '',
              '### Sync summary',
              '```json',
              syncSummary,
              '```',
              '',
              '### Sync log tail',
              '```text',
              syncLogTail,
              '```',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'automation'],
              });
            }

      - name: Fail workflow when sync fails
        if: steps.sync.outcome == 'failure'
        run: exit 1
